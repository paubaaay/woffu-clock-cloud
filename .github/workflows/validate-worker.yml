name: Validate Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check src/index-v2.js
          node --check src/index-v5.js
          node --check src/index-v6.js
          node --check src/index-v7.js
          node --check src/index-v8.js

      - name: Install dependencies
        run: npm install

      - name: Check Wrangler version
        run: npx wrangler --version

      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir dist
