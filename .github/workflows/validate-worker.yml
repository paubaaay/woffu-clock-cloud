name: Validate Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check stable v2 syntax
        run: node --check src/index-v2.js

      - name: Check v3 syntax
        run: node --check src/index-v3.js

      - name: Check v4 syntax
        run: node --check src/index-v4.js

      - name: Validate Wrangler configuration
        run: |
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); console.log('wrangler.jsonc OK')"
